<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  body { width: 1500px; height: 700px; font-family: "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1500" height="700" viewBox="0 0 1500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1500" height="700" fill="#ffffff"/>

  <!-- input image -->
  <image href="input_photo.png" x="40" y="220" width="200" height="200"/>
  <text x="140" y="465" font-size="28" fill="#0b0b0b" text-anchor="middle">Image</text>

  <!-- vision encoder (highlighted) -->
  <text x="450" y="52" font-size="30" font-weight="700" fill="#D62728" text-anchor="middle">FastVLM only changes this</text>
  <rect x="300" y="72" width="300" height="580" rx="16" fill="#ffffff" stroke="#D62728" stroke-width="5"/>
  <text x="450" y="118" font-size="32" font-weight="700" fill="#0b0b0b" text-anchor="middle">Vision encoder</text>
  <image href="fastvit_column_noimg.png" x="353" y="140" width="194" height="445"/>
  <text x="450" y="625" font-size="22" fill="#52514e" text-anchor="middle">(predecessor FastViT)</text>

  <!-- projector -->
  <rect x="690" y="260" width="200" height="120" rx="16" fill="#f5f5f4" stroke="#52514e" stroke-width="3"/>
  <text x="790" y="331" font-size="32" fill="#0b0b0b" text-anchor="middle">Projector</text>

  <!-- text question -->
  <rect x="690" y="500" width="200" height="100" rx="16" fill="#f5f5f4" stroke="#52514e" stroke-width="3"/>
  <text x="790" y="561" font-size="28" fill="#0b0b0b" text-anchor="middle">Text prompt</text>

  <!-- LLM -->
  <rect x="1050" y="160" width="240" height="460" rx="16" fill="#f5f5f4" stroke="#52514e" stroke-width="3"/>
  <text x="1170" y="402" font-size="40" font-weight="700" fill="#0b0b0b" text-anchor="middle">LLM</text>

  <!-- answer -->
  <text x="1430" y="402" font-size="32" fill="#0b0b0b" text-anchor="middle">Answer</text>

  <!-- arrows -->
  <g stroke="#52514e" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="245" y1="320" x2="292" y2="320"/>
    <line x1="606" y1="320" x2="682" y2="320"/>
    <line x1="896" y1="320" x2="1042" y2="320"/>
    <line x1="896" y1="550" x2="1042" y2="550"/>
    <line x1="1296" y1="390" x2="1362" y2="390"/>
  </g>
  <text x="969" y="304" font-size="20" fill="#52514e" text-anchor="middle">visual tokens</text>
  <text x="969" y="534" font-size="20" fill="#52514e" text-anchor="middle">text tokens</text>
</svg>
</body>
</html>
